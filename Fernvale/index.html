
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141414">
    <title>Fernvale</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="hero" id="home">
        <img
            class="hero__image"
            src="https://res.cloudinary.com/l2zjedd6/image/upload/v1795017220/6ab9da927e32879b459b16c8_2c48c5b30809f92c4a160df25cfb3487_hero-finetics.avif"
            alt="Fernvale financial consultant in a city street"
        >
        <div class="hero__shade" aria-hidden="true"></div>

        <header class="site-header">
            <a class="brand" href="#home" aria-label="Fernvale home">
                <img
                    class="brand__icon"
                    src="https://res.cloudinary.com/l2zjedd6/image/upload/f_auto/q_auto/6ab73ef108b097acb7174062_7c23b36b9a908c74966cc90c09f6c9e0_Fernvale_20Icon.svg"
                    alt=""
                >
                <span>Fernvale</span>
            </a>

            <nav class="navigation" aria-label="Main navigation">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#service">Service</a>
                <a href="#case-study">Case Study</a>
            </nav>

            <a class="contact-link" href="mailto:hello@fernvale.com">Contact</a>
        </header>

        <section class="hero__content" aria-labelledby="hero-title">
            <h1 id="hero-title">Building Scalable<br>Financial Foundations</h1>
        </section>

        <div class="hero__proof" id="about">
            <div class="client-avatars" aria-hidden="true">
                <img src="https://i.pravatar.cc/80?img=12" >
                <img src="https://i.pravatar.cc/80?img=47" >
                <img src="https://i.pravatar.cc/80?img=13" >
            </div>
            <span class="client-count">900+ Verified Clients</span>
        </div>

        <section class="hero__actions" id="service" aria-label="Get started">
            <p>A complete breakdown of how structured financial planning turned operational challenges into scalable market success.</p>
            <div class="hero__buttons">
                <a class="button button--light" href="mailto:hello@fernvale.com">Get Started</a>
                <a class="button button--dark" href="#case-study">Explore Our Services</a>
            </div>
        </section>
        <span id="case-study" class="anchor-target" aria-hidden="true"></span>
    </main>


</body>
</html>
